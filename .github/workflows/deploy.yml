name: Build and deploy

on:
  push:
    branches:
      - init
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shop-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy shop.loganjian.top
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Configure deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy static files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync \
            --recursive \
            --links \
            --perms \
            --times \
            --compress \
            --delete-delay \
            --delay-updates \
            --rsh="ssh -o BatchMode=yes -o IdentitiesOnly=yes" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:/"

      - name: Verify production site
        run: curl --fail --show-error --silent --retry 3 https://shop.loganjian.top/ > /dev/null
